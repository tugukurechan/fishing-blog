version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 公開から2週間未満の版は採用しない（docs/decisions.md D-05）
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ランタイム（Node 22）に型定義を合わせる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next / typescript-eslint が未対応のメジャー版（ikokka D-16 と同じ）
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
