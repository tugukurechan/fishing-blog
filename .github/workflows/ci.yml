name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      # 記事の項目と、写真に位置情報が残っていないかも確かめる
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
